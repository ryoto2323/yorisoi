<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Yorisoi不動産 RECRUITING | Beyond Real Estate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@400;700&family=Zen+Old+Mincho:wght@700;900&family=Caveat:wght@400;700&family=Zen+Kurenaido&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brandRed: '#E60012',
              navy: '#0F172A',
              orange: '#FF6B00',
              blue: '#0EA5E9',
              cream: '#FFFBF5',
              white: '#FFFFFF',
              yellow: '#FACC15',
              sky: '#F0F9FF',
            },
            fontFamily: {
              sans: ['"Noto Sans JP"', '"Inter"', 'sans-serif'],
              mono: ['"Space Grotesk"', 'monospace'],
              serif: ['"Zen Old Mincho"', 'serif'],
              handwriting: ['"Caveat"', 'cursive'],
              handwritingJP: ['"Zen Kurenaido"', 'sans-serif'],
              condensed: ['"Oswald"', 'sans-serif'],
            },
            transitionTimingFunction: {
              'spring': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            }
          }
        }
      }
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      body {
        font-family: '"Noto Sans JP"', sans-serif;
        background-color: #0F172A;
        color: #0F172A;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* PC Only Redirection Screen Styles */
      #pc-invitation {
        display: none;
      }

      @media screen and (min-width: 1024px) {
        #root {
          display: none !important;
        }

        body {
          background-color: #f8fafc !important;
          overflow: hidden !important;
        }

        #pc-invitation {
          display: flex !important;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: fixed;
          inset: 0;
          z-index: 99999;
          background-image: radial-gradient(circle at 20% 20%, #FFFBF5 0%, #f1f5f9 100%);
        }

        .qr-card {
          background: white;
          padding: 3rem;
          border-radius: 4rem;
          box-shadow: 0 40px 100px -20px rgba(15, 23, 42, 0.15);
          text-align: center;
          max-width: 480px;
          width: 90%;
          border: 1px solid rgba(15, 23, 42, 0.05);
        }
      }

      /* Liquid Distortion Transition Effect (Mobile Only) */
      .liquid-entrance {
        filter: url(#liquid-filter);
        transition: filter 1.4s cubic-bezier(0.2, 0, 0.2, 1);
        will-change: filter, transform, opacity;
      }
      .liquid-entrance.mood-slow {
        filter: url(#liquid-filter-slow);
      }
      .active .liquid-entrance {
        filter: none;
      }

      @keyframes float-qr {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float-qr {
        animation: float-qr 4s ease-in-out infinite;
      }

      .bg-noise {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <!-- PC Invitation Screen -->
    <div id="pc-invitation">
      <div class="qr-card">
        <div class="mb-8 flex justify-center">
          <div class="w-24 h-24 bg-orange/10 rounded-[2rem] flex items-center justify-center text-orange animate-float-qr">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
          </div>
        </div>
        
        <h1 class="text-navy text-xs font-black font-mono tracking-[0.5em] mb-4 opacity-40 uppercase">MOBILE EXPERIENCE ONLY</h1>
        <h2 class="text-3xl font-black text-navy mb-6 leading-tight">
          スマホで体験する<br/>
          次世代の採用サイト
        </h2>
        
        <p class="text-sm text-gray-500 font-bold leading-relaxed mb-10 px-4">
          このサイトは、スマートフォンでの没入体験に特化してデザインされています。お手持ちの端末でQRコードを読み取ってアクセスしてください。
        </p>
        
        <div class="relative inline-block p-4 bg-navy rounded-[2.5rem] shadow-2xl mb-4 group overflow-hidden">
          <div class="absolute inset-0 bg-orange opacity-0 group-hover:opacity-10 transition-opacity"></div>
          <img 
            src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https://yorisoi-recruit-2026.example.com&color=ffffff&bgcolor=0f172a" 
            alt="Scan Me" 
            class="w-48 h-48 rounded-2xl relative z-10"
          />
        </div>
        
        <div class="text-[10px] font-black text-orange tracking-[0.3em] mt-2">SCAN ME</div>
      </div>
      
      <div class="mt-12 text-center opacity-20">
        <div class="text-xl font-black font-sans tracking-[0.2em] text-navy">YORISOI</div>
        <div class="text-[8px] font-mono font-bold text-navy mt-1 uppercase tracking-widest">© 2026 Yorisoi Real Estate</div>
      </div>
    </div>

    <!-- Main Content Root -->
    <div id="root"></div>

    <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true">
      <filter id="liquid-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="5">
          <animate attributeName="baseFrequency" dur="8s" values="0.012;0.008;0.012" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="60" />
      </filter>
      <filter id="liquid-filter-slow">
        <feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="2" seed="1">
          <animate attributeName="baseFrequency" dur="20s" values="0.005;0.003;0.005" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="20" />
      </filter>
    </svg>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
